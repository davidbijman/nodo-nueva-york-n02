[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-node"
version = "1.0.0"
description = "Núcleo configurable de referencia para Sonantia Network 1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
  "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-mock>=3.14,<4",
  "ruff>=0.11,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
distributed_node = ["templates/*.j2"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
